stages:
  - install
  - lint
  - build
  - test
  - deploy

variables:
  NODE_IMAGE: "node:22-bookworm-slim"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

default:
  image: $NODE_IMAGE
  # This instance's only online shared runner ("cloudrun-ephemeral")
  # requires this tag and ignores untagged jobs (run_untagged: false) —
  # without it every job sits queued until it times out. Check `glab api
  # runners/all` if this ever needs revisiting (e.g. a new runner appears).
  tags:
    - cloudrun
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/

# Installs once to fail fast and warm the shared cache (keyed on
# package-lock.json, see `default.cache` above). Does NOT pass
# node_modules/ downstream as a job artifact — with ~28k files it blew
# past this instance's artifact upload size limit (413). Every job below
# instead runs its own `npm ci --prefer-offline`, which is fast because
# the cache is already warm — cheaper than fighting artifact size limits.
install:
  stage: install
  script:
    - npm ci --prefer-offline

lint:
  stage: lint
  needs: ["install"]
  script:
    - npm ci --prefer-offline
    - npm run lint
    - npm run typecheck

build:
  stage: build
  needs: ["install"]
  script:
    - npm ci --prefer-offline
    # Compile-only quality gate: no real secrets needed, so it reuses the
    # committed, placeholder-only .env.test (same one the E2E stage uses)
    # just to satisfy lib/env.ts validation at build time. Output isn't
    # needed downstream (Vercel does its own build for the real deploy),
    # so no artifact here either.
    - npx dotenv -e .env.test -- npm run build

# getDisplayMedia can't be driven headlessly, so the app's own E2E suite
# mocks it and runs against a REAL ephemeral backend instead of hitting
# Atlas/R2 from CI — see AGENTS.md > Testing.
#
# Locally (scripts/test-e2e.sh) that backend is Mongo + RustFS via
# `docker compose`, and it's fully green there (the actual Fase 9
# acceptance criterion). In CI this job tries the same thing via
# GitLab's native `services:` (sibling containers, no privileged mode
# needed) instead of Docker-in-Docker — but on THIS instance's only
# online runner ("cloudrun-ephemeral"), service alias DNS doesn't
# resolve at all (`getaddrinfo EAI_AGAIN mongo`/`rustfs`), the same
# failure mode `docker:dind` hit here (`lookup docker ... no such
# host`). That's an infrastructure gap in this runner, not a bug in the
# app or the suite — the runner actually built for this
# (`vps-dind-shared`) has been offline for months; see `glab api
# runners/all`. allow_failure: true until that's fixed on the instance
# side, so a runner-side networking gap can't block merges to main —
# lint/typecheck/build (which do work reliably here) remain hard gates.
test:e2e:
  stage: test
  needs: ["install"]
  allow_failure: true
  image: mcr.microsoft.com/playwright:v1.63.0-jammy
  services:
    - name: mongo:7
      alias: mongo
    - name: rustfs/rustfs:latest
      alias: rustfs
      variables:
        RUSTFS_ACCESS_KEY: rustfsadmin
        RUSTFS_SECRET_KEY: rustfsadmin
        RUSTFS_VOLUMES: /data/rustfs0
        RUSTFS_ADDRESS: 0.0.0.0:9000
        RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
        RUSTFS_CONSOLE_ENABLE: "true"
  variables:
    MONGODB_URI: mongodb://mongo:27017/screen-capture-ci
    S3_ENDPOINT: http://rustfs:9000
    S3_ACCESS_KEY: rustfsadmin
    S3_SECRET_KEY: rustfsadmin
    S3_BUCKET: recordings-ci
    S3_REGION: auto
    S3_FORCE_PATH_STYLE: "true"
    S3_PUBLIC_URL: http://rustfs:9000/recordings-ci
    S3_CORS_ORIGIN: "*"
    NODE_ENV: test
  before_script:
    - npm ci --prefer-offline
    # Belt-and-suspenders: this image is supposed to ship a matching
    # Chromium already, but it wasn't where Playwright looked
    # (~/.cache/ms-playwright) — install explicitly rather than trust
    # the image's PLAYWRIGHT_BROWSERS_PATH setup. --with-deps because a
    # freshly downloaded browser needs its own apt dependencies
    # (libglib-2.0.so.0 etc.) that plain `install chromium` skips.
    - npx playwright install --with-deps chromium
  script:
    - npx next build
    # Redirected, not inherited: an unredirected background process here
    # keeps the job's stdout/stderr pipe open forever (next start never
    # exits on its own), so gitlab-runner never sees EOF and the job
    # hangs well past when the tests actually finish.
    - npx next start -p 3100 > next-start.log 2>&1 &
    - SERVER_PID=$!
    - |
      for i in $(seq 1 60); do
        curl -sf http://localhost:3100 > /dev/null && break
        [ "$i" -eq 60 ] && { echo "Server did not start in time" >&2; cat next-start.log; exit 1; }
        sleep 1
      done
    - npx playwright test; EXIT_CODE=$?; kill "$SERVER_PID" 2>/dev/null || true; exit $EXIT_CODE
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: test-results/junit.xml

# Deploy strategy: Vercel's native Git integration only supports GitHub,
# GitLab.com and Bitbucket — NOT self-hosted GitLab instances like
# gitlab.codecrypto.academy. Rather than driving deploys from this
# pipeline (Vercel CLI + a VERCEL_TOKEN living in GitLab), this repo
# push-mirrors to a GitHub repo (Settings → Repository → Mirroring
# repositories in GitLab) and Vercel's project is imported natively from
# that GitHub mirror — Vercel deploys itself on every push the mirror
# forwards, entirely outside GitLab. See AGENTS.md for the mirror setup.
#
# So this stage is NOT a deploy step: it's the required quality gate
# GitLab's branch protection points at, so main can't merge with red
# lint/build. test:e2e is intentionally not required here — it's
# allow_failure: true (see the comment above it) because of a runner
# networking gap on this instance, not because E2E doesn't matter.
deploy:gate:
  stage: deploy
  needs: ["lint", "build", "test:e2e"]
  # `needs` still waits for test:e2e to finish (so its artifacts land
  # before the gate reports), but allow_failure above means a red
  # test:e2e doesn't block this job — only lint/build failing does.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Quality gate passed on main — the GitHub mirror + Vercel's native import handle the actual deploy."
