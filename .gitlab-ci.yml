stages:
  - install
  - lint
  - build
  - test
  - deploy

variables:
  NODE_IMAGE: "node:22-bookworm-slim"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

default:
  image: $NODE_IMAGE
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/

install:
  stage: install
  script:
    - npm ci --prefer-offline
  artifacts:
    expire_in: 1 hour
    paths:
      - node_modules/

lint:
  stage: lint
  needs: ["install"]
  script:
    - npm run lint
    - npm run typecheck

build:
  stage: build
  needs: ["install"]
  script:
    # Compile-only quality gate: no real secrets needed, so it reuses the
    # committed, placeholder-only .env.test (same one the E2E stage uses)
    # just to satisfy lib/env.ts validation at build time.
    - npx dotenv -e .env.test -- npm run build
  artifacts:
    expire_in: 1 hour
    paths:
      - .next/

# getDisplayMedia can't be driven headlessly, so the app's own E2E suite
# mocks it and runs against a REAL ephemeral backend (Mongo + RustFS)
# instead of hitting Atlas/R2 from CI — see AGENTS.md > Testing and
# scripts/test-e2e.sh. This stage needs Docker-in-Docker to bring that
# stack up.
test:e2e:
  stage: test
  needs: ["install"]
  image: mcr.microsoft.com/playwright:v1.63.0-jammy
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apt-get update -y
    - install -m 0755 -d /etc/apt/keyrings
    - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    - chmod a+r /etc/apt/keyrings/docker.asc
    - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
    - apt-get update -y
    - apt-get install -y --no-install-recommends docker-ce-cli docker-compose-plugin
  script:
    - npm run test:e2e
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: test-results/junit.xml

# Deploy strategy: Vercel's native GitLab integration (recommended by
# PROMT.md Fase 12) — connect the Vercel project directly to this GitLab
# repo; Vercel then deploys previews per MR and production on merge to
# main, entirely outside this pipeline. This stage is therefore NOT a
# deploy step: it's the required quality gate GitLab's branch protection
# points at, so main can't merge with red lint/build/E2E.
#
# Alternative (not used): deploy explicitly via `vercel deploy --prod
# --token=$VERCEL_TOKEN` here, using VERCEL_TOKEN / VERCEL_ORG_ID /
# VERCEL_PROJECT_ID as protected CI/CD variables. Switch to this only if
# the native Git integration isn't available on the current Vercel plan.
deploy:gate:
  stage: deploy
  needs: ["lint", "build", "test:e2e"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Quality gate passed on main — Vercel's GitLab integration handles the actual deploy."
